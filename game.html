    <h1>Silly Word Generator</h1> 
    <p>Click the button to generate a word combo!</p> 
    <div id="word"></div> 
    <button onclick="generateWord()">Generate Word</button> 
    <script> const adjectives = [ "Sparkly", "Dancing", "Sleepy", "Wiggly", "Flying", "Grumpy" ]; 
    const nouns = [ "Pickle", "Dragon", "Potato", "Unicorn", "Penguin", "Taco" ]; 
    function generateWord() { const adjective = adjectives[Math.floor(Math.random() * adjectives.length)]; 
    const noun = nouns[Math.floor(Math.random() * nouns.length)]; document.getElementById("word").textContent = adjective + " " + noun; } 
    </script>
